</style></head><body><div class="w"><header><h1>Central de Informações sobre Benefícios Sociais</h1><p id="sub"></p></header><main id="app"></main>

function home(){track("PageView",{page:"quiz"});app.innerHTML='<div class="card"><span class="pill">⏱ Leva menos de 1 minuto.</span><h2>'+esc(C.intro)+'</h2><p class="mu">'+esc(C.introTxt)+'</p><button class="btn" id="go">QUERO DESCOBRIR</button></div>';

var os=document.getElementById("os");q.o.forEach(function(o){var b=document.createElement("button");b.className="opt"+(A[i]===o?" on":"");b.innerHTML="<i></i><span class=\"ic\">"+ico(o)+"</span><span>"+esc(o)+"</span>";b.onclick=function(){A[i]=o;save();[].forEach.call(os.children,function(x){x.classList.remove("on")});b.classList.add("on");document.getElementById("er").textContent=""};os.appendChild(b)});
if(i)document.getElementById("bk").onclick=function(){location.hash="quiz/"+i};

if(!db){msg("Banco de dados indisponível.");return}db.doc("config/main").set(n).then(function(){C=n;msg("Salvo!")}).catch(function(){msg("Erro ao salvar.")})};
function msg(t){document.getElementById("msg").textContent=t}
if(!db){document.getElementById("st").textContent="Métricas indisponíveis (sem acesso ao banco).";return}
db.collection("ev").get().then(function(s){var T={},Q={};s.docs.forEach(function(d){var v=d.data();T[v.type]=(T[v.type]||0)+1;if(v.type==="QuizQuestionAnswered"){var k=v.q+"|"+v.a;Q[k]=(Q[k]||0)+1}});
var rows=Object.keys(Q).sort().map(function(k){var p=k.split("|");return[+p[0]+1,p.slice(1).join("|"),Q[k]]});
document.getElementById("st").innerHTML='<div class="kp"><div><b>'+(T.QuizStart||0)+'</b>iniciaram</div><div><b>'+(T.QuizComplete||0)+'</b>concluíram</div><div><b>'+(T.InitiateCheckout||0)+'</b>cliques na venda</div></div><h3>Respostas por pergunta</h3><div class="sc"><table><tr><th>P</th><th>Resposta</th><th>Qtd</th></tr>'+rows.map(function(r){return"<tr><td>"+r[0]+"</td><td>"+esc(r[1])+"</td><td>"+r[2]+"</td></tr>"}).join("")+"</table></div>";
document.getElementById("csv").onclick=function(){var t="metrica,pergunta,resposta,quantidade\n";Object.keys(T).forEach(function(k){t+=k+",,,"+T[k]+"\n"});rows.forEach(function(r){t+='QuizQuestionAnswered,'+r[0]+',"'+r[1].replace(/"/g,'""')+'",'+r[2]+"\n"});
var bl=new Blob([t],{type:"text/csv"});(window.claude?claude.use("downloads"):Promise.resolve(null)).then(function(d){if(d)return d.save({filename:"quiz-agregado.csv",data:bl});var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="quiz-agregado.csv";a.click()}).catch(function(){})}}).catch(function(){document.getElementById("st").textContent="Não foi possível ler as métricas."})}
/* router */
function route(){clearTimeout(window.tm);var h=location.hash.replace("#","");document.getElementById("sub").textContent=C.sub;window.scrollTo(0,0);
if(h.indexOf("quiz/")==0)quiz(parseInt(h.slice(5))||1);else if(h==="resultado")result();else if(h==="vendas")sales();else if(h==="admin")admin();else home()}
window.addEventListener("hashchange",route);var started=0;function start(){if(started)return;started=1;ready=1;loadPix();route()}setTimeout(start,4000);
(async function(){try{if(!window.claude)return;usr=await claude.use("user");db=await claude.use("db");
if(db){try{var s=await db.doc("config/main").get();if(s.exists){C=Object.assign({},D,s.data())}}catch(e){}}
}catch(e){}start()})();
</script></body></html>
